name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  # queue, never cancel: a cancelled run could stop a Cloudflare Pages upload half way
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # IndexNow step compares with the previous commit
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # https://fauna.bristleconelab.org is served by Cloudflare Pages (project fauna-atlas).
      # Uses the bristleconelab organisation secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit).
      - name: Cloudflare token present?
        if: github.event_name != 'pull_request'
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::CLOUDFLARE_API_TOKEN not set: the live site was NOT updated"; fi
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.on == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 95c89337261f10f37ac1310191b2ebb7
        run: npx --yes wrangler@4.168.0 pages deploy dist --project-name fauna-atlas --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s | head -c 200)"
      # Bing and other IndexNow engines, after a data refresh only: the URLs whose sitemap <lastmod> is the data's own
      # fetch date (not today's date, which a refresh that ends after midnight UTC would miss)
      - name: IndexNow
        if: steps.cf.outputs.on == 'true'
        continue-on-error: true
        run: |
          if git diff --quiet HEAD~1 HEAD -- data/pages 2>/dev/null; then echo "no page data change: nothing to send"; exit 0; fi
          scripts/indexnow.sh --since "$(python3 -c 'import json;print(json.load(open("data/pages/species.json"))["fetched"])')"
